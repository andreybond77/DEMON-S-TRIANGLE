<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔺 Demon's Triangle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="machine">
    <!-- 12 струек лавы по периметру -->
    <div class="marquee" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <h1>🔺 DEMON'S TRIANGLE 🔻</h1>

    <div class="field-wrapper">
      <svg id="field" viewBox="-25 -5 150 135" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="info" id="info">
      Нажмите на SPIN для генерации цифр, затем на внешние треугольники для прокрутки
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
